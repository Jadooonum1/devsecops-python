apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shelflend
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Jadooonum1/devsecops-python.git
    targetRevision: main
    path: helm/shelflend
    helm:
      valueFiles:
        - values.yaml
        - ../../gitops/values-gitops.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: shelflend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: shelflend-backend
      jsonPointers:
        - /spec/replicas   # the HPA owns this
