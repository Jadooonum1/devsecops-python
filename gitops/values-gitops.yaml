# Values Argo CD applies to the `shelflend` namespace.
# The CI "promote" job rewrites the two tags below after a green build;
# that commit is what Argo CD syncs. Do not edit the tag lines by hand.
backend:
  image:
    tag: "8d6a30f977b3e767db084de559ee3b4bfba6b21f"
frontend:
  image:
    tag: "8d6a30f977b3e767db084de559ee3b4bfba6b21f"
postgres:
  existingSecret: shelflend-db   # created once at bootstrap; Argo CD can't use Helm lookup()
ingress:
  host: shelflend.local
monitoring:
  enabled: true
