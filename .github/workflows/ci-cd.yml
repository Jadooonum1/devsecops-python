name: ShelfLend CI/CD

# test -> build -> scan -> push (GHCR, tagged by commit SHA) -> deploy to a
# throwaway kind cluster and smoke-test -> promote the SHA into gitops/ so
# Argo CD rolls it out.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "demo/**"
      - "screenshots/**"
      - "evidence/**"
      - "gitops/values-gitops.yaml" # the promote commit must not re-trigger the pipeline
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Any failing test fails this job, and every image job depends on it.
      - name: pytest
        run: python -m pytest -v --cov=app --cov-report=term-missing --junitxml=pytest.xml
      - name: Test summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("pytest.xml").getroot()
          s = root if root.tag == "testsuite" else root.find("testsuite")
          print(f"### pytest: {s.get('tests')} tests, {s.get('failures')} failures, {s.get('errors')} errors, {s.get('skipped')} skipped")
          EOF

  migrations:
    name: Migrations on real Postgres
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shelflend
          POSTGRES_USER: shelflend
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shelflend" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://shelflend:ci-only-password@localhost:5432/shelflend
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: upgrade -> downgrade -> upgrade
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current | grep -q "(head)"
      - name: Three replicas migrating at once take turns on the advisory lock
        run: |
          alembic downgrade base
          for i in 1 2 3; do (alembic upgrade head > "mig-$i.log" 2>&1) & done
          wait
          cat mig-*.log
          ran=$(grep -l "Running upgrade  -> 0001" mig-*.log | wc -l)
          echo "replicas that applied 0001: $ran"
          test "$ran" -eq 1

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  security:
    name: Secrets + SAST
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 } # gitleaks scans the whole history
      - name: Gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --no-banner --redact --config /repo/security/.gitleaks.toml
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Bandit (medium+ severity fails)
        run: |
          pip install bandit==1.9.4
          bandit -c security/bandit.yaml -r backend/app -ll

  helm-lint:
    name: Helm lint + render
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Lint and render every values file
        run: |
          for f in values-dev values-staging values-prod; do
            helm lint helm/shelflend -f "helm/shelflend/$f.yaml" --set backend.image.tag=ci --set frontend.image.tag=ci
            helm template shelflend helm/shelflend -f "helm/shelflend/$f.yaml" --set backend.image.tag=ci --set frontend.image.tag=ci > /dev/null
          done
          helm template shelflend helm/shelflend -f gitops/values-gitops.yaml > /dev/null
      - name: Chart refuses to render without an image tag
        run: "! helm template shelflend helm/shelflend 2>/dev/null"

  images:
    name: Build + Trivy (${{ matrix.component }})
    needs: [backend-tests, migrations, frontend-build, security, helm-lint]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with: { platforms: arm64 }
      - uses: docker/setup-buildx-action@v4
      # amd64 for EKS/CI, arm64 for Apple-silicon kind clusters. The result is
      # one OCI archive: it is scanned per platform below and then pushed as-is.
      - name: Build multi-arch image (linux/amd64, linux/arm64)
        run: |
          docker buildx build --pull \
            --platform linux/amd64,linux/arm64 \
            --provenance=false --sbom=false \
            --build-arg APP_VERSION="${GITHUB_SHA::7}" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --output type=oci,dest=image.tar \
            ${{ matrix.component }}
      - name: Trivy scan each platform (fails on fixable HIGH/CRITICAL)
        run: |
          set -o pipefail
          : > trivy.txt
          for arch in amd64 arm64; do
            skopeo copy --override-arch "$arch" --override-os linux oci-archive:image.tar "docker-archive:${arch}.tar"
            echo "===== linux/${arch} =====" | tee -a trivy.txt
            docker run --rm -v "$PWD:/work" -v "$PWD/security:/cfg:ro" "$TRIVY_IMAGE" \
              image --config /cfg/trivy.yaml --db-repository mirror.gcr.io/aquasec/trivy-db,ghcr.io/aquasecurity/trivy-db \
              --input "/work/${arch}.tar" | tee -a trivy.txt
          done
      - name: Trivy summary
        if: always()
        run: |
          {
            echo "### Trivy: shelflend-${{ matrix.component }}:${GITHUB_SHA::7}"
            echo '```'
            grep -E '=====|Total:|^│ .*(alpine|debian|python-pkg|node-pkg).*│ +[0-9]+ +│' trivy.txt | grep -v 'METADATA' | head -40
            grep -B2 -A8 'Report Summary' trivy.txt | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Compress scanned archive
        run: gzip -1 image.tar
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.component }}
          path: image.tar.gz
          retention-days: 3

  push:
    name: Push to GHCR (${{ matrix.component }})
    needs: images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/download-artifact@v8
        with: { name: "image-${{ matrix.component }}" }
      - name: Push the scanned archive, tagged with the full commit SHA (never :latest)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gunzip image.tar.gz
          owner="${GITHUB_REPOSITORY_OWNER,,}" # GHCR rejects upper-case
          ref="ghcr.io/${owner}/shelflend-${{ matrix.component }}:${GITHUB_SHA}"
          skopeo copy --all --dest-creds "${GITHUB_ACTOR}:${GHCR_TOKEN}" oci-archive:image.tar "docker://${ref}"
          skopeo inspect --raw "docker://${ref}" | jq -r '.manifests[] | "\(.platform.os)/\(.platform.architecture) \(.digest)"' | tee platforms.txt
          {
            echo "Pushed \`$ref\`"
            echo '```'; cat platforms.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to kind + smoke test
    needs: push
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1
        with: { cluster_name: ci }
      - name: helm upgrade --install from GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          kubectl apply -f k8s/namespace.yaml
          kubectl -n shelflend create secret docker-registry ghcr \
            --docker-server=ghcr.io --docker-username="${GITHUB_ACTOR}" --docker-password="${GHCR_TOKEN}"
          helm upgrade --install shelflend helm/shelflend -n shelflend -f helm/shelflend/values-dev.yaml \
            --set backend.image.repository="ghcr.io/${owner}/shelflend-backend" \
            --set frontend.image.repository="ghcr.io/${owner}/shelflend-frontend" \
            --set backend.image.tag="${GITHUB_SHA}" --set frontend.image.tag="${GITHUB_SHA}" \
            --set "imagePullSecrets[0].name=ghcr" \
            --wait --timeout 5m
          kubectl -n shelflend get pods,svc,ingress -o wide
      - name: Smoke test through the frontend Service (nginx -> backend)
        run: |
          kubectl -n shelflend port-forward svc/shelflend-frontend 8080:80 > /dev/null 2>&1 &
          for _ in $(seq 1 30); do curl -sf localhost:8080/healthz > /dev/null && break; sleep 1; done
          set -x
          curl -sf localhost:8080/api/info | tee info.json
          grep -q "\"version\":\"${GITHUB_SHA::7}\"" info.json
          body='{"isbn":"9780134685991","title":"Smoke Test","author":"CI"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -d "$body" localhost:8080/api/books)" = 201
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -d "$body" localhost:8080/api/books)" = 409
          curl -sf localhost:8080/ | grep -q '<div id="root">'
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n shelflend get all
          kubectl -n shelflend describe pods | tail -80
          kubectl -n shelflend logs -l app.kubernetes.io/component=backend --tail=80 || true

  promote:
    name: Promote SHA to gitops/
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Write the new tags and push (Argo CD picks this up)
        run: |
          sed -i -E "s/^(    tag: ).*/\1\"${GITHUB_SHA}\"/" gitops/values-gitops.yaml
          git diff --stat
          git config user.name "Parth Agarwal"
          git config user.email "177961753+Jadooonum1@users.noreply.github.com"
          git commit -am "gitops: promote ${GITHUB_SHA::7} to production" || { echo "nothing to promote"; exit 0; }
          for _ in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main
          done
          exit 1
