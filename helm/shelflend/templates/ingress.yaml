{{- if .Values.ingress.enabled }}
{{- $backend := printf "%s-backend" (include "shelflend.fullname" .) }}
{{- $frontend := printf "%s-frontend" (include "shelflend.fullname" .) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "shelflend.fullname" . }}
  labels: {{- include "shelflend.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: {{ $backend }}, port: { name: http } } }
          - path: /docs
            pathType: Prefix
            backend: { service: { name: {{ $backend }}, port: { name: http } } }
          # ingress-nginx rejects dots in Prefix paths
          - path: /openapi.json
            pathType: ImplementationSpecific
            backend: { service: { name: {{ $backend }}, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ $frontend }}, port: { name: http } } }
{{- end }}
