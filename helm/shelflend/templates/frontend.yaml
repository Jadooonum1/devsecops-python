{{- $tag := required "frontend.image.tag is required (deploy by commit SHA)" .Values.frontend.image.tag }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shelflend.fullname" . }}-frontend
  labels:
    {{- include "shelflend.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
    app.kubernetes.io/version: {{ $tag | trunc 63 | quote }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: {{- include "shelflend.selector" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "shelflend.selector" (dict "root" . "component" "frontend") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext: {{- include "shelflend.podSecurity" (dict "uid" 101) | nindent 8 }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ $tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: BACKEND_URL
              value: http://{{ include "shelflend.fullname" . }}-backend:8000
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext: {{- include "shelflend.containerSecurity" . | nindent 12 }}
          volumeMounts:
            # envsubst renders the nginx template here at start; root FS is read-only
            - { name: conf, mountPath: /etc/nginx/conf.d }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shelflend.fullname" . }}-frontend
  labels:
    {{- include "shelflend.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector: {{- include "shelflend.selector" (dict "root" . "component" "frontend") | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
