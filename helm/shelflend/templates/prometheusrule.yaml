{{- if .Values.monitoring.enabled }}
{{- $svc := printf "%s-backend" (include "shelflend.fullname" .) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "shelflend.fullname" . }}
  labels: {{- include "shelflend.labels" . | nindent 4 }}
spec:
  groups:
    - name: shelflend.availability
      rules:
        - alert: ShelfLendBackendDown
          expr: sum(up{service="{{ $svc }}"}) == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: No ShelfLend backend replica is being scraped successfully.
        - alert: ShelfLendHigh5xxRate
          expr: |
            sum(rate(http_requests_total{service="{{ $svc }}",status="5xx"}[5m]))
              / clamp_min(sum(rate(http_requests_total{service="{{ $svc }}"}[5m])), 1e-9) > 0.05
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: More than 5% of ShelfLend API requests are failing with 5xx.
        - alert: ShelfLendSlowP95
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{service="{{ $svc }}"}[5m]))) > 0.5
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: ShelfLend API p95 latency is above 500 ms.
    - name: shelflend.business
      rules:
        # every replica reports the same DB-backed number, so take max()
        - alert: ShelfLendOverdueLoansHigh
          expr: max(shelflend_loans_overdue{service="{{ $svc }}"}) > {{ .Values.monitoring.overdueAlertThreshold }}
          for: 10m
          labels: { severity: info }
          annotations:
            summary: "{{ "{{" }} $value {{ "}}" }} loans are overdue; time to send reminders."
{{- end }}
