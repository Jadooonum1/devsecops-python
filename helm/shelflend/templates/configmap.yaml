apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shelflend.fullname" . }}-config
  labels: {{- include "shelflend.labels" . | nindent 4 }}
data:
  DB_HOST: {{ include "shelflend.fullname" . }}-postgres
  DB_PORT: "5432"
  DB_NAME: {{ .Values.postgres.database | quote }}
  DB_USER: {{ .Values.postgres.user | quote }}
  LOAN_DAYS: {{ .Values.backend.rules.loanDays | quote }}
  MAX_RENEWALS: {{ .Values.backend.rules.maxRenewals | quote }}
  FINE_PER_DAY: {{ .Values.backend.rules.finePerDay | quote }}
  FINE_BLOCK_LIMIT: {{ .Values.backend.rules.fineBlockLimit | quote }}
