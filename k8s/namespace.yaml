# Bootstrap namespaces. Both enforce the "restricted" Pod Security Standard,
# so any pod that runs as root or keeps capabilities is rejected.
apiVersion: v1
kind: Namespace
metadata:
  name: shelflend
  labels:
    app.kubernetes.io/part-of: shelflend
    environment: production
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: shelflend-staging
  labels:
    app.kubernetes.io/part-of: shelflend
    environment: staging
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
